# /plan (full tier). Demo seed: today's blocks and one commitment (task 32, "Trabajo", Mon-Fri
# 09:00-17:00 Madrid), whose blocks appear on the first range read. Writes use February 2027
# (2027-02-01 is a Monday, CET).
db_volatile:
  - plan_blocks.created_at
  - plan_blocks.updated_at
  - recurring_commitments.created_at
  - recurring_commitments.updated_at
requests:
  - name: no token
    path: /plan/today
  - name: semi token
    path: /plan/today
    tier: semi

  # Reads
  - name: today
    path: /plan/today
    tier: full
    # Free time counts down with the clock.
    volatile: [totals.free_seconds]
  - name: commitments
    path: /plan/commitments
    tier: full
  - name: range without from
    path: /plan/range?to=2027-02-08
    tier: full
  - name: range with a bad to
    path: /plan/range?from=2027-02-01&to=8-2-2027
    tier: full
  - name: range ending on its start
    path: /plan/range?from=2027-02-01&to=2027-02-01
    tier: full
  - name: range generates the work week
    path: /plan/range?from=2027-02-01&to=2027-02-08
    tier: full
    capture: {mon: "blocks[0].id", tue: "blocks[1].id"}
  - name: range again generates nothing new
    path: /plan/range?from=2027-02-01&to=2027-02-08
    tier: full

  # Create blocks
  - name: free block, label trimmed
    method: POST
    path: /plan/blocks
    tier: full
    body: {started_at: "2027-02-01T17:30:00Z", ended_at: "2027-02-01T18:00:00Z", label: " cena "}
    capture: {free: id}
  - name: linked block takes the task name
    method: POST
    path: /plan/blocks
    tier: full
    body: {started_at: "2027-02-01T18:00:00Z", ended_at: "2027-02-01T19:00:00+00:00", task_id: 7}
    capture: {linked: id}
  - name: event block
    method: POST
    path: /plan/blocks
    tier: full
    body:
      started_at: "2027-02-02T19:00:00+01:00"
      ended_at: "2027-02-02T20:00:00+01:00"
      label: Concierto
      note: entradas
      event_ref: ev-1
  - name: same event again
    method: POST
    path: /plan/blocks
    tier: full
    body: {started_at: "2027-02-03T18:00:00Z", ended_at: "2027-02-03T19:00:00Z", label: x, event_ref: ev-1}
  - name: overlaps the work block
    method: POST
    path: /plan/blocks
    tier: full
    body: {started_at: "2027-02-01T10:00:00Z", ended_at: "2027-02-01T11:00:00Z", label: x}
  - name: inverted times
    method: POST
    path: /plan/blocks
    tier: full
    body: {started_at: "2027-02-06T11:00:00Z", ended_at: "2027-02-06T10:00:00Z", label: x}
  - name: no times
    method: POST
    path: /plan/blocks
    tier: full
    body: {label: x}
  - name: no label and no task
    method: POST
    path: /plan/blocks
    tier: full
    body: {started_at: "2027-02-06T10:00:00Z", ended_at: "2027-02-06T11:00:00Z", label: "  "}
  - name: label too long
    method: POST
    path: /plan/blocks
    tier: full
    body:
      started_at: "2027-02-06T10:00:00Z"
      ended_at: "2027-02-06T11:00:00Z"
      label: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  - name: unknown task
    method: POST
    path: /plan/blocks
    tier: full
    body: {started_at: "2027-02-06T10:00:00Z", ended_at: "2027-02-06T11:00:00Z", task_id: 999999}
  - name: malformed body
    method: POST
    path: /plan/blocks
    tier: full
    raw: nope
  - name: time that is not RFC 3339
    method: POST
    path: /plan/blocks
    tier: full
    body: {started_at: yesterday, ended_at: "2027-02-06T11:00:00Z", label: x}

  # Update blocks
  - name: relabel and annotate
    method: PUT
    path: /plan/blocks/{{free}}
    tier: full
    body: {label: "  merienda ", note: n}
  - name: clear the note
    method: PUT
    path: /plan/blocks/{{free}}
    tier: full
    body: {clear_note: true, note: ignored}
  - name: unlink the task
    method: PUT
    path: /plan/blocks/{{linked}}
    tier: full
    body: {clear_task: true, task_id: 7}
  - name: link another task
    method: PUT
    path: /plan/blocks/{{free}}
    tier: full
    body: {task_id: 13}
  - name: start after the stored end
    method: PUT
    path: /plan/blocks/{{free}}
    tier: full
    body: {started_at: "2027-02-01T18:30:00Z"}
  - name: end only
    method: PUT
    path: /plan/blocks/{{free}}
    tier: full
    body: {ended_at: "2027-02-01T17:45:00Z"}
  - name: empty label
    method: PUT
    path: /plan/blocks/{{free}}
    tier: full
    body: {label: ""}
  - name: move onto the work block
    method: PUT
    path: /plan/blocks/{{free}}
    tier: full
    body: {started_at: "2027-02-01T15:30:00Z", ended_at: "2027-02-01T16:30:00Z"}
  - name: unknown block
    method: PUT
    path: /plan/blocks/999999
    tier: full
    body: {label: x}
  - name: unknown block with times
    method: PUT
    path: /plan/blocks/999999
    tier: full
    body: {started_at: "2027-03-01T10:00:00Z", ended_at: "2027-03-01T11:00:00Z"}
  - name: invalid block id
    method: PUT
    path: /plan/blocks/abc
    tier: full
    body: {label: x}
  - name: move Monday's work block to Saturday
    method: PUT
    path: /plan/blocks/{{mon}}
    tier: full
    body: {started_at: "2027-02-06T08:00:00Z", ended_at: "2027-02-06T09:00:00Z"}
  - name: Monday is not generated again
    path: /plan/range?from=2027-02-01&to=2027-02-08
    tier: full

  # Delete blocks
  - name: delete Tuesday's work block
    method: DELETE
    path: /plan/blocks/{{tue}}
    tier: full
  - name: Tuesday stays deleted
    path: /plan/range?from=2027-02-01&to=2027-02-08
    tier: full
  - name: delete an unknown block
    method: DELETE
    path: /plan/blocks/999999
    tier: full
  - name: delete with an invalid id
    method: DELETE
    path: /plan/blocks/0
    tier: full

  # Commitments
  - name: create a commitment
    method: POST
    path: /plan/commitments
    tier: full
    body: {task_id: 1, label: " Gym ", days_of_week: [6], start_time: "7:00", end_time: "08:00"}
    capture: {gym: id}
  - name: commitment without label
    method: POST
    path: /plan/commitments
    tier: full
    body: {task_id: 1, label: " ", days_of_week: [6], start_time: "07:00", end_time: "08:00"}
  - name: commitment without days
    method: POST
    path: /plan/commitments
    tier: full
    body: {task_id: 1, label: x, start_time: "07:00", end_time: "08:00"}
  - name: commitment for an unknown task
    method: POST
    path: /plan/commitments
    tier: full
    body: {task_id: 999999, label: x, days_of_week: [6], start_time: "07:00", end_time: "08:00"}
  - name: commitment with a bad time
    method: POST
    path: /plan/commitments
    tier: full
    body: {task_id: 1, label: x, days_of_week: [6], start_time: "25:00", end_time: "26:00"}
  - name: commitment ending before it starts
    method: POST
    path: /plan/commitments
    tier: full
    body: {task_id: 1, label: x, days_of_week: [6], start_time: "09:00", end_time: "08:00"}
  - name: commitment with a malformed body
    method: POST
    path: /plan/commitments
    tier: full
    raw: '{"task_id": "x"}'
  - name: the week with the gym
    path: /plan/range?from=2027-02-01&to=2027-02-08
    tier: full
  - name: move the gym to the evening
    method: PUT
    path: /plan/commitments/{{gym}}
    tier: full
    body: {start_time: "18:00", end_time: "19:00"}
  - name: the gym block moved
    path: /plan/range?from=2027-02-06&to=2027-02-07
    tier: full
  - name: gym on Sundays only
    method: PUT
    path: /plan/commitments/{{gym}}
    tier: full
    body: {days_of_week: [0], label: Gimnasio}
  - name: Saturday's gym block is gone
    path: /plan/range?from=2027-02-06&to=2027-02-07
    tier: full
  - name: pause the gym
    method: PUT
    path: /plan/commitments/{{gym}}
    tier: full
    body: {active: false}
  - name: paused week
    path: /plan/range?from=2027-02-01&to=2027-02-15
    tier: full
  - name: resume the gym
    method: PUT
    path: /plan/commitments/{{gym}}
    tier: full
    body: {active: true}
  - name: resumed week
    path: /plan/range?from=2027-02-01&to=2027-02-15
    tier: full
  - name: empty commitment label
    method: PUT
    path: /plan/commitments/{{gym}}
    tier: full
    body: {label: ""}
  - name: empty commitment days
    method: PUT
    path: /plan/commitments/{{gym}}
    tier: full
    body: {days_of_week: []}
  - name: unknown commitment
    method: PUT
    path: /plan/commitments/999999
    tier: full
    body: {label: x}
  - name: invalid commitment id
    method: PUT
    path: /plan/commitments/abc
    tier: full
    body: {label: x}
  - name: commitments with the gym
    path: /plan/commitments
    tier: full
  - name: delete the gym
    method: DELETE
    path: /plan/commitments/{{gym}}
    tier: full
  - name: delete an unknown commitment
    method: DELETE
    path: /plan/commitments/999999
    tier: full
  - name: commitments after the delete
    path: /plan/commitments
    tier: full

  # Future and routing
  - name: delete every future block
    method: DELETE
    path: /plan/blocks/future
    tier: full
  - name: nothing left in February
    path: /plan/range?from=2027-02-01&to=2027-02-15
    tier: full
  - name: wrong method on blocks
    method: GET
    path: /plan/blocks
    tier: full
  - name: wrong method on a block
    method: PATCH
    path: /plan/blocks/1
    tier: full
