# Router and middleware behavior shared by every route (spec http-platform).
requests:
  - name: unknown path
    path: /nope
  - name: unknown nested path
    path: /habits/1/nope/2
  - name: trailing slash is not redirected
    path: /health/
  - name: trailing slash on a POST route
    method: POST
    path: /login/
    body: {password: "{{password}}"}
  - name: wrong method lists Allow
    method: POST
    path: /health
  - name: GET on a POST route
    path: /login
  - name: DELETE on a POST route
    method: DELETE
    path: /login/2fa
  - name: no automatic HEAD
    method: HEAD
    path: /health
  - name: OPTIONS without preflight headers
    method: OPTIONS
    path: /login

  - name: preflight from gv-web
    method: OPTIONS
    path: /login
    headers:
      Origin: https://gv.example.com
      Access-Control-Request-Method: POST
      Access-Control-Request-Headers: content-type,authorization
  - name: preflight from the second allowed origin
    method: OPTIONS
    path: /health
    headers:
      Origin: http://localhost:5173
      Access-Control-Request-Method: GET
  - name: preflight from a foreign origin
    method: OPTIONS
    path: /login
    headers:
      Origin: https://evil.example.com
      Access-Control-Request-Method: POST
  - name: preflight asking for a header outside the list
    method: OPTIONS
    path: /login
    headers:
      Origin: https://gv.example.com
      Access-Control-Request-Method: POST
      Access-Control-Request-Headers: x-evil
  - name: preflight asking for a method outside the list
    method: OPTIONS
    path: /login
    headers:
      Origin: https://gv.example.com
      Access-Control-Request-Method: TRACE
  - name: preflight on an unknown path
    method: OPTIONS
    path: /nope
    headers:
      Origin: https://gv.example.com
      Access-Control-Request-Method: GET
  - name: simple request from gv-web
    path: /health
    headers: {Origin: https://gv.example.com}
  - name: simple request from a foreign origin
    path: /health
    headers: {Origin: https://evil.example.com}
  - name: error response keeps CORS headers
    method: POST
    path: /login
    headers: {Origin: https://gv.example.com}
    body: {password: wrong}
  - name: 404 keeps CORS headers
    path: /nope
    headers: {Origin: https://gv.example.com}
