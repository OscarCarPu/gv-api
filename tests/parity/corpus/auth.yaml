# Tier checks on protected routes live in each domain's corpus (the first is habits).
requests:
  - name: private password
    method: POST
    path: /login
    body: {password: "{{password}}"}
    volatile: [token]
    capture: {tmp: token}
  - name: semiprivate password
    method: POST
    path: /login
    body: {password: "{{semi_password}}"}
    volatile: [token]
  - name: wrong password
    method: POST
    path: /login
    body: {password: wrong}
  - name: empty password
    method: POST
    path: /login
    body: {password: ""}
  - name: unknown fields are ignored
    method: POST
    path: /login
    body: {password: "{{password}}", remember: true}
    volatile: [token]
  - name: null body is the zero value
    method: POST
    path: /login
    raw: "null"
  - name: null password
    method: POST
    path: /login
    body: {password: null}
  - name: password of the wrong type
    method: POST
    path: /login
    body: {password: 123}
  - name: not json
    method: POST
    path: /login
    raw: not json
  - name: empty body
    method: POST
    path: /login
    raw: ""
  - name: json array
    method: POST
    path: /login
    raw: "[]"
  - name: trailing data after the object
    method: POST
    path: /login
    raw: '{"password": "wrong"} trailing'
    accepted: strict-json
    expect_py: {status: 400, body: {error: Invalid Request}}

  - name: 2fa wrong code
    method: POST
    path: /login/2fa
    body: {token: "{{tmp}}", code: "000000"}
  - name: 2fa code of the wrong length
    method: POST
    path: /login/2fa
    body: {token: "{{tmp}}", code: "12345"}
  - name: 2fa bad token
    method: POST
    path: /login/2fa
    body: {token: bad-token, code: "123456"}
  - name: 2fa semi token
    method: POST
    path: /login/2fa
    body: {token: "{{token.semi}}", code: "{{totp}}"}
  - name: 2fa full token
    method: POST
    path: /login/2fa
    body: {token: "{{token.full}}", code: "{{totp}}"}
  - name: 2fa not json
    method: POST
    path: /login/2fa
    raw: "{"
  - name: 2fa current code
    method: POST
    path: /login/2fa
    body: {token: "{{tmp}}", code: "{{totp}}"}
    volatile: [token]
