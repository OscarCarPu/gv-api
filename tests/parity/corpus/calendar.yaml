# /calendar/events (full tier). Filters take an RFC 3339 instant or a plain date (midnight UTC).
# A plan block links an event through event_ref (the event id): moving the event moves the
# block, deleting it detaches the block. Writes use April 2027.
db_volatile:
  - calendar_events.created_at
  - calendar_events.updated_at
  - plan_blocks.created_at
  - plan_blocks.updated_at
requests:
  - name: no token
    path: /calendar/events?from=2027-04-01&to=2027-05-01
  - name: semi token
    path: /calendar/events?from=2027-04-01&to=2027-05-01
    tier: semi

  # Create
  - name: create the dentist
    method: POST
    path: /calendar/events
    tier: full
    body: {name: " Dentist ", start_time: "2027-04-05T09:00:00Z", end_time: "2027-04-05T10:00:00Z"}
    capture: {dentist: id}
  - name: create a trip across days
    method: POST
    path: /calendar/events
    tier: full
    body: {name: Trip, start_time: "2027-04-06T20:00:00+02:00", end_time: "2027-04-08T12:00:00.25+02:00"}
    capture: {trip: id}
  - name: create without a name
    method: POST
    path: /calendar/events
    tier: full
    body: {name: "  ", start_time: "2027-04-05T09:00:00Z", end_time: "2027-04-05T10:00:00Z"}
  - name: create ending at its start
    method: POST
    path: /calendar/events
    tier: full
    body: {name: x, start_time: "2027-04-05T09:00:00Z", end_time: "2027-04-05T09:00:00Z"}
  - name: create without times
    method: POST
    path: /calendar/events
    tier: full
    body: {name: x}
  - name: create with a malformed body
    method: POST
    path: /calendar/events
    tier: full
    raw: "{"
  - name: create with a time that is not RFC 3339
    method: POST
    path: /calendar/events
    tier: full
    body: {name: x, start_time: "2027-04-05", end_time: "2027-04-05T10:00:00Z"}

  # Read
  - name: list April by dates
    path: /calendar/events?from=2027-04-01&to=2027-05-01
    tier: full
  - name: list by instants
    path: /calendar/events?from=2027-04-05T09:30:00Z&to=2027-04-07T00:00:00.5Z
    tier: full
  - name: list by instants with an offset
    path: /calendar/events?from=2027-04-05T12:00:00%2B02:00&to=2027-04-06
    tier: full
  - name: list from the end of the dentist
    path: /calendar/events?from=2027-04-05T10:00:00Z&to=2027-04-06T00:00:00Z
    tier: full
  - name: list without from
    path: /calendar/events?to=2027-05-01
    tier: full
  - name: list with a bad to
    path: /calendar/events?from=2027-04-01&to=April
    tier: full
  - name: list with an instant without offset
    path: /calendar/events?from=2027-04-01T00:00:00&to=2027-05-01
    tier: full
  - name: list inverted
    path: /calendar/events?from=2027-05-01&to=2027-04-01
    tier: full
  - name: list longer than two years
    path: /calendar/events?from=2027-01-01&to=2029-01-10
    tier: full
  - name: get the dentist
    path: /calendar/events/{{dentist}}
    tier: full
  - name: get an unknown event
    path: /calendar/events/999999
    tier: full
  - name: get with an invalid id
    path: /calendar/events/abc
    tier: full

  # A plan block linked to the dentist
  - name: plan the dentist
    method: POST
    path: /plan/blocks
    tier: full
    raw: >-
      {"started_at": "2027-04-05T09:00:00Z", "ended_at": "2027-04-05T10:00:00Z",
      "label": "Dentist", "event_ref": "{{dentist}}"}
  - name: move the dentist
    method: PATCH
    path: /calendar/events/{{dentist}}
    tier: full
    body: {start_time: "2027-04-06T22:30:00Z", end_time: "2027-04-06T23:30:00Z"}
  - name: the block moved with it
    path: /plan/range?from=2027-04-05&to=2027-04-08
    tier: full
  - name: rename the dentist
    method: PATCH
    path: /calendar/events/{{dentist}}
    tier: full
    body: {name: " Dentist (moved) ", start_time: null}
  - name: lengthen the dentist
    method: PATCH
    path: /calendar/events/{{dentist}}
    tier: full
    body: {end_time: "2027-04-07T00:30:00Z"}
  - name: patch nothing
    method: PATCH
    path: /calendar/events/{{dentist}}
    tier: full
    body: {}
  - name: patch an empty name
    method: PATCH
    path: /calendar/events/{{dentist}}
    tier: full
    body: {name: ""}
  - name: patch an end before the start
    method: PATCH
    path: /calendar/events/{{dentist}}
    tier: full
    body: {end_time: "2027-04-06T20:00:00Z"}
  - name: patch an unknown event
    method: PATCH
    path: /calendar/events/999999
    tier: full
    body: {name: x}
  - name: patch with a malformed body
    method: PATCH
    path: /calendar/events/{{dentist}}
    tier: full
    raw: "[]"

  # Delete
  - name: delete the dentist
    method: DELETE
    path: /calendar/events/{{dentist}}
    tier: full
  - name: the block is detached
    path: /plan/range?from=2027-04-05&to=2027-04-08
    tier: full
  - name: delete it again
    method: DELETE
    path: /calendar/events/{{dentist}}
    tier: full
  - name: delete with an invalid id
    method: DELETE
    path: /calendar/events/0
    tier: full
  - name: list April at the end
    path: /calendar/events?from=2027-04-01&to=2027-05-01
    tier: full
  - name: wrong method on an event
    method: PUT
    path: /calendar/events/{{trip}}
    tier: full
