# /rutas/marks (semi tier: semi or full tokens). The demo seed has no marks.
db_volatile: [concello_marks.created_at]
requests:
  - name: no token
    path: /rutas/marks
  - name: tmp token
    path: /rutas/marks
    headers: {Authorization: "Bearer {{token.tmp}}"}
  - name: empty list
    path: /rutas/marks
    tier: semi

  - name: create with a semi token
    method: POST
    path: /rutas/marks
    tier: semi
    body: {name: "  Arzúa  ", visited_on: "2026-06-11", description: queixo}
    capture: {arzua: id}
  - name: create with a full token
    method: POST
    path: /rutas/marks
    tier: full
    body: {name: Melide, visited_on: "2026-06-11", description: null, extra: 1}
    capture: {melide: id}
  - name: create on a later day
    method: POST
    path: /rutas/marks
    tier: semi
    body: {name: Sobrado, visited_on: "2026-06-12"}
    capture: {sobrado: id}
  - name: create with a 200-byte name
    method: POST
    path: /rutas/marks
    tier: semi
    body: {name: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", visited_on: "2026-01-01"}

  - name: create with a whitespace name
    method: POST
    path: /rutas/marks
    tier: semi
    body: {name: "   ", visited_on: "2026-06-11"}
  - name: create with a 201-byte name
    method: POST
    path: /rutas/marks
    tier: semi
    body: {name: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", visited_on: "2026-01-01"}
  - name: create without visited_on
    method: POST
    path: /rutas/marks
    tier: semi
    body: {name: Arzúa}
  - name: create with a dd/mm/yyyy date
    method: POST
    path: /rutas/marks
    tier: semi
    body: {name: Arzúa, visited_on: "11/06/2026"}
  - name: create with a date that does not exist
    method: POST
    path: /rutas/marks
    tier: semi
    body: {name: Arzúa, visited_on: "2026-02-30"}
  - name: create with a timestamp
    method: POST
    path: /rutas/marks
    tier: semi
    body: {name: Arzúa, visited_on: "2026-06-11T10:00:00Z"}
  - name: create with a quote in the date
    method: POST
    path: /rutas/marks
    tier: semi
    body: {name: Arzúa, visited_on: "2026\"06"}
    accepted: error-text-unescaped
    expect_py:
      status: 400
      body: {error: 'invalid date "2026"06": must be YYYY-MM-DD'}
  - name: create with a numeric date
    method: POST
    path: /rutas/marks
    tier: semi
    body: {name: Arzúa, visited_on: 20260611}
  - name: create not json
    method: POST
    path: /rutas/marks
    tier: semi
    raw: not json
  - name: create with a null body
    method: POST
    path: /rutas/marks
    tier: semi
    raw: "null"

  - name: list after creating
    path: /rutas/marks
    tier: full
  - name: get with a semi token
    path: /rutas/marks/{{arzua}}
    tier: semi
  - name: get with a full token
    path: /rutas/marks/{{melide}}
    tier: full
  - name: get an unknown mark
    path: /rutas/marks/999999
    tier: semi
  - name: get with an invalid id
    path: /rutas/marks/abc
    tier: semi
  - name: get with id zero
    path: /rutas/marks/0
    tier: semi

  - name: update keeps the name
    method: PUT
    path: /rutas/marks/{{melide}}
    tier: semi
    body: {name: ignored, visited_on: "2026-06-13", description: new}
  - name: update with a full token
    method: PUT
    path: /rutas/marks/{{sobrado}}
    tier: full
    body: {visited_on: "2026-06-10"}
  - name: update without visited_on
    method: PUT
    path: /rutas/marks/{{melide}}
    tier: semi
    body: {description: x}
  - name: update with a bad date
    method: PUT
    path: /rutas/marks/{{melide}}
    tier: semi
    body: {visited_on: "13/06/2026"}
  - name: update an unknown mark
    method: PUT
    path: /rutas/marks/999999
    tier: semi
    body: {visited_on: "2026-06-13"}
  - name: update not json
    method: PUT
    path: /rutas/marks/{{melide}}
    tier: semi
    raw: "{"
  - name: update with an invalid id
    method: PUT
    path: /rutas/marks/abc
    tier: semi
    body: {visited_on: "2026-06-13"}

  - name: delete with a semi token
    method: DELETE
    path: /rutas/marks/{{sobrado}}
    tier: semi
  - name: delete again
    method: DELETE
    path: /rutas/marks/{{sobrado}}
    tier: full
  - name: delete with an invalid id
    method: DELETE
    path: /rutas/marks/-1
    tier: semi

  - name: wrong method on the collection
    method: DELETE
    path: /rutas/marks
    tier: semi
  - name: wrong method on an item
    method: POST
    path: /rutas/marks/1
    tier: semi
  - name: final list
    path: /rutas/marks
    tier: semi
