# /tasks (full tier) except by-due-date, which needs plan and capacity (capacity.yaml). Demo seed:
# projects 1-7 (1 > 2 > 3 started, 5 > 6 not started), tasks 1-22, no open time entry.
# Cascades stamp now(), so finished_at is volatile in the database.
db_volatile: [projects.finished_at, tasks.finished_at]
requests:
  - name: no token
    path: /tasks/tree
  - name: semi token
    path: /tasks/tree
    tier: semi

  # Reads on the seed
  - name: active tree
    path: /tasks/tree
    tier: full
  - name: active tree from priority 2
    path: /tasks/tree?min_priority=2
    tier: full
  - name: active tree with a bad min_priority
    path: /tasks/tree?min_priority=9
    tier: full
  - name: root projects
    path: /tasks/projects
    tier: full
    accepted: root-projects-full-row
    expect_py: {status: 200}
  - name: projects list-fast
    path: /tasks/projects/list-fast
    tier: full
  - name: project 1
    path: /tasks/projects/1
    tier: full
  - name: project 1 children
    path: /tasks/projects/1/children
    tier: full
  - name: project 7 children
    path: /tasks/projects/7/children
    tier: full
  - name: project 2 parent candidates
    path: /tasks/projects/2/parent-candidates
    tier: full
  - name: unknown project
    path: /tasks/projects/999999
    tier: full
  - name: unknown project children
    path: /tasks/projects/999999/children
    tier: full
  - name: unknown project candidates
    path: /tasks/projects/999999/parent-candidates
    tier: full
  - name: invalid project id
    path: /tasks/projects/abc
    tier: full
  - name: tasks list-fast
    path: /tasks/tasks/list-fast
    tier: full
  - name: task 1
    path: /tasks/tasks/1
    tier: full
  - name: task 1 time entries
    path: /tasks/tasks/1/time-entries
    tier: full
  - name: unknown task
    path: /tasks/tasks/999999
    tier: full
  - name: unknown task time entries
    path: /tasks/tasks/999999/time-entries
    tier: full
  - name: no active time entry
    path: /tasks/time-entries/active
    tier: full
  - name: time entry summary
    path: /tasks/time-entries/summary
    tier: full
  - name: time entries since a month ago
    path: /tasks/time-entries?start_time=2026-01-01
    tier: full
  - name: time entries without start
    path: /tasks/time-entries
    tier: full
  - name: time entries with a bad start
    path: /tasks/time-entries?start_time=yesterday
    tier: full
  - name: time entries with a bad end
    path: /tasks/time-entries?start_time=2026-01-01&end_time=x
    tier: full
  - name: history daily by default dates
    path: /tasks/time-entries/history?frequency=daily
    tier: full
  - name: history weekly explicit range
    path: /tasks/time-entries/history?frequency=weekly&start_at=2025-12-01&end_at=2026-12-31
    tier: full
  - name: history monthly
    path: /tasks/time-entries/history?frequency=monthly&start_at=2025-01-01
    tier: full
  - name: history without frequency
    path: /tasks/time-entries/history
    tier: full
  - name: history with a bad frequency
    path: /tasks/time-entries/history?frequency=yearly
    tier: full
  - name: history with a bad start
    path: /tasks/time-entries/history?frequency=daily&start_at=x
    tier: full

  # Projects
  - name: create root project
    method: POST
    path: /tasks/projects
    tier: full
    body: {name: Parity root, description: d, due_at: "2026-12-31T00:00:00Z", priority: 2}
    capture: {root: id}
  - name: create child project
    method: POST
    path: /tasks/projects
    tier: full
    raw: '{"name": "Parity child", "parent_id": {{root}}}'
    capture: {child: id}
  - name: create other project
    method: POST
    path: /tasks/projects
    tier: full
    body: {name: Parity other, due_at: "2026-11-30T23:00:00-05:00"}
    capture: {other: id}
  - name: create project without name
    method: POST
    path: /tasks/projects
    tier: full
    body: {}
  - name: create project with a long name
    method: POST
    path: /tasks/projects
    tier: full
    body: {name: "01234567890123456789012345678901234567890"}
  - name: create project with a bad priority
    method: POST
    path: /tasks/projects
    tier: full
    body: {name: x, priority: 0}
  - name: create project with a date-only due
    method: POST
    path: /tasks/projects
    tier: full
    body: {name: x, due_at: "2026-12-31"}
  - name: start root
    method: PATCH
    path: /tasks/projects/{{root}}
    tier: full
    body: {started_at: "2026-03-01T09:00:00Z", description: started}
  - name: start child
    method: PATCH
    path: /tasks/projects/{{child}}
    tier: full
    body: {started_at: "2026-03-02T09:00:00.5Z"}
  - name: move child under other
    method: PATCH
    path: /tasks/projects/{{child}}
    tier: full
    raw: '{"parent_id": {{other}}}'
  - name: move other under its child (cycle)
    method: PATCH
    path: /tasks/projects/{{other}}
    tier: full
    raw: '{"parent_id": {{child}}}'
  - name: move under itself
    method: PATCH
    path: /tasks/projects/{{other}}
    tier: full
    raw: '{"parent_id": {{other}}}'
  - name: move under an unknown parent
    method: PATCH
    path: /tasks/projects/{{child}}
    tier: full
    body: {parent_id: 999999}
  - name: move an unknown project
    method: PATCH
    path: /tasks/projects/999999
    tier: full
    raw: '{"parent_id": {{root}}}'
  - name: patch an unknown project
    method: PATCH
    path: /tasks/projects/999999
    tier: full
    body: {name: x}
  - name: move child back to the root
    method: PATCH
    path: /tasks/projects/{{child}}
    tier: full
    body: {parent_id: null}
  - name: move child under root again
    method: PATCH
    path: /tasks/projects/{{child}}
    tier: full
    raw: '{"parent_id": {{root}}}'
  - name: clear other due date
    method: PATCH
    path: /tasks/projects/{{other}}
    tier: full
    body: {due_at: null, priority: 5}
  - name: patch with a bad priority
    method: PATCH
    path: /tasks/projects/{{other}}
    tier: full
    body: {priority: 6}
  - name: patch project not json
    method: PATCH
    path: /tasks/projects/{{other}}
    tier: full
    raw: "{"
  - name: root candidates
    path: /tasks/projects/{{child}}/parent-candidates
    tier: full

  # Tasks
  - name: create task taking the project priority
    method: POST
    path: /tasks/tasks
    tier: full
    raw: '{"project_id": {{root}}, "name": "Parity A", "estimate_hours": 2.5, "due_at": "2026-12-01T00:00:00Z"}'
    capture: {a: id}
  - name: create dependent task
    method: POST
    path: /tasks/tasks
    tier: full
    raw: '{"project_id": {{root}}, "name": "Parity B", "depends_on": [{{a}}], "priority": 1, "estimate_hours": "1.25"}'
    capture: {b: id}
  - name: create recurring task
    method: POST
    path: /tasks/tasks
    tier: full
    raw: '{"project_id": {{child}}, "name": "Parity R", "task_type": "recurring", "recurrence": 7}'
    capture: {r: id}
  - name: create loose continuous task
    method: POST
    path: /tasks/tasks
    tier: full
    body: {name: Parity C, task_type: continuous, description: loose}
    capture: {c: id}
  - name: create in an unknown project
    method: POST
    path: /tasks/tasks
    tier: full
    body: {name: x, project_id: 999999}
  - name: create recurring without recurrence
    method: POST
    path: /tasks/tasks
    tier: full
    body: {name: x, task_type: recurring}
  - name: create standard with recurrence
    method: POST
    path: /tasks/tasks
    tier: full
    body: {name: x, recurrence: 3}
  - name: create with a zero recurrence
    method: POST
    path: /tasks/tasks
    tier: full
    body: {name: x, task_type: recurring, recurrence: 0}
  - name: create with an unknown type
    method: POST
    path: /tasks/tasks
    tier: full
    body: {name: x, task_type: weekly}
  - name: create with a bad priority
    method: POST
    path: /tasks/tasks
    tier: full
    body: {name: x, priority: 7}
  - name: create with a bad estimate
    method: POST
    path: /tasks/tasks
    tier: full
    body: {name: x, estimate_hours: abc}
  - name: create without a name
    method: POST
    path: /tasks/tasks
    tier: full
    body: {name: ""}
  - name: get dependent task
    path: /tasks/tasks/{{b}}
    tier: full
  - name: make A block C
    method: PATCH
    path: /tasks/tasks/{{a}}
    tier: full
    raw: '{"blocks": [{{c}}], "started_at": "2026-03-10T08:00:00Z", "name": "Parity A2"}'
  - name: depend A on B (cycle)
    method: PATCH
    path: /tasks/tasks/{{a}}
    tier: full
    raw: '{"depends_on": [{{b}}]}'
  - name: clear B estimate and due
    method: PATCH
    path: /tasks/tasks/{{b}}
    tier: full
    body: {estimate_hours: null, due_at: null}
  - name: turn R into standard
    method: PATCH
    path: /tasks/tasks/{{r}}
    tier: full
    body: {task_type: standard}
  - name: turn R back to recurring without recurrence
    method: PATCH
    path: /tasks/tasks/{{r}}
    tier: full
    body: {task_type: recurring}
  - name: set a recurrence alone
    method: PATCH
    path: /tasks/tasks/{{r}}
    tier: full
    body: {recurrence: -1}
  - name: patch an unknown task
    method: PATCH
    path: /tasks/tasks/999999
    tier: full
    body: {name: x}
  - name: patch with a long name
    method: PATCH
    path: /tasks/tasks/{{a}}
    tier: full
    body: {name: "01234567890123456789012345678901234567890"}
  - name: tree after edits
    path: /tasks/tree
    tier: full
  - name: root children after edits
    path: /tasks/projects/{{root}}/children
    tier: full

  # Todos
  - name: create todo
    method: POST
    path: /tasks/todos
    tier: full
    raw: '{"task_id": {{a}}, "name": "first"}'
    capture: {todo: id}
  - name: create second todo
    method: POST
    path: /tasks/todos
    tier: full
    raw: '{"task_id": {{a}}, "name": "second"}'
  - name: create todo without task
    method: POST
    path: /tasks/todos
    tier: full
    body: {name: x}
  - name: create todo without name
    method: POST
    path: /tasks/todos
    tier: full
    raw: '{"task_id": {{a}}}'
  - name: create todo on an unknown task
    method: POST
    path: /tasks/todos
    tier: full
    body: {task_id: 999999, name: x}
  - name: tick todo
    method: PATCH
    path: /tasks/todos/{{todo}}
    tier: full
    body: {is_done: true}
  - name: patch an unknown todo
    method: PATCH
    path: /tasks/todos/999999
    tier: full
    body: {name: x}
  - name: task with todos
    path: /tasks/tasks/{{a}}
    tier: full

  # Time entries
  - name: create finished entry
    method: POST
    path: /tasks/time-entries
    tier: full
    raw: '{"task_id": {{a}}, "started_at": "2026-03-10T08:00:00Z", "finished_at": "2026-03-10T09:30:00Z", "comment": "c"}'
    capture: {e1: id}
  - name: open an entry
    method: POST
    path: /tasks/time-entries
    tier: full
    raw: '{"task_id": {{c}}, "started_at": "2026-03-11T08:00:00.25+01:00"}'
    capture: {e2: id}
  - name: a second open entry conflicts
    method: POST
    path: /tasks/time-entries
    tier: full
    raw: '{"task_id": {{a}}, "started_at": "2026-03-11T10:00:00Z"}'
  - name: entry without task
    method: POST
    path: /tasks/time-entries
    tier: full
    body: {started_at: "2026-03-11T10:00:00Z"}
  - name: entry without start
    method: POST
    path: /tasks/time-entries
    tier: full
    raw: '{"task_id": {{a}}}'
  - name: entry with a bad start
    method: POST
    path: /tasks/time-entries
    tier: full
    raw: '{"task_id": {{a}}, "started_at": "2026-03-11"}'
  - name: active entry
    path: /tasks/time-entries/active
    tier: full
  - name: close the open entry
    method: PATCH
    path: /tasks/time-entries/{{e2}}
    tier: full
    body: {finished_at: "2026-03-11T08:45:00Z"}
  - name: patch an unknown entry
    method: PATCH
    path: /tasks/time-entries/999999
    tier: full
    body: {comment: x}
  - name: entries of A
    path: /tasks/tasks/{{a}}/time-entries
    tier: full
  - name: entries in March
    path: /tasks/time-entries?start_time=2026-03-10&end_time=2026-03-11
    tier: full
  - name: history over the entries
    path: /tasks/time-entries/history?frequency=daily&start_at=2026-03-09&end_at=2026-03-12
    tier: full
  - name: project time spent
    path: /tasks/projects/{{root}}
    tier: full

  # Finish and delete
  - name: finish the root project (cascade)
    method: PATCH
    path: /tasks/projects/{{root}}
    tier: full
    body: {finished_at: "2026-03-12T10:00:00Z"}
  - name: child is finished too
    path: /tasks/projects/{{child}}
    tier: full
    volatile: [finished_at]
  - name: delete entry
    method: DELETE
    path: /tasks/time-entries/{{e1}}
    tier: full
  - name: delete entry again
    method: DELETE
    path: /tasks/time-entries/{{e1}}
    tier: full
  - name: delete todo
    method: DELETE
    path: /tasks/todos/{{todo}}
    tier: full
  - name: delete task C
    method: DELETE
    path: /tasks/tasks/{{c}}
    tier: full
  - name: delete an unknown task
    method: DELETE
    path: /tasks/tasks/999999
    tier: full
  - name: delete a project with tasks
    method: DELETE
    path: /tasks/projects/{{root}}
    tier: full
  - name: delete the empty other project
    method: DELETE
    path: /tasks/projects/{{other}}
    tier: full
  - name: delete it again
    method: DELETE
    path: /tasks/projects/{{other}}
    tier: full
  - name: delete with an invalid id
    method: DELETE
    path: /tasks/todos/0
    tier: full

  # Routing
  - name: wrong method on a project
    method: PUT
    path: /tasks/projects/1
    tier: full
  - name: final tree
    path: /tasks/tree
    tier: full
