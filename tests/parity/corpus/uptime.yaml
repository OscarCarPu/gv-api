# /domotics/uptime (semi tier). Each app's heartbeat writes `outages` on its own clock: a row
# right after start, whose ends_at then moves every 30 s. Everything measured up to now moves
# with the clock too. On a production snapshot the open outage and `up_since` also depend on
# when each app started.
db_volatile: [outages.ends_at]
requests:
  - name: no token
    path: /domotics/uptime
  - name: overview with a semi token
    path: /domotics/uptime
    tier: semi
    volatile: &clock
      - "ranges[*].up_seconds"
      - "ranges[*].down_seconds"
      - "ranges[*].failover_seconds"
      - "ranges[*].range_end"
      - up_since
  - name: overview with a full token
    path: /domotics/uptime
    tier: full
    volatile: *clock
  - name: windows by default
    path: /domotics/uptime/windows
    tier: semi
    volatile: &windows [to, up_seconds, down_seconds, "windows[*].end_time", "windows[*].seconds"]
  - name: windows with a limit
    path: /domotics/uptime/windows?limit=1
    tier: semi
    volatile: *windows
  - name: windows from a date
    path: /domotics/uptime/windows?from=2026-01-01
    tier: semi
    volatile: *windows
  - name: windows before tracking began
    path: /domotics/uptime/windows?from=2020-01-01T00:00:00Z&to=2020-02-01T00:00:00Z
    tier: semi
  - name: windows with a bad from
    path: /domotics/uptime/windows?from=yesterday
    tier: semi
  - name: windows with a bad to
    path: /domotics/uptime/windows?to=2026-8-1
    tier: semi
  - name: windows with a zero limit
    path: /domotics/uptime/windows?limit=0
    tier: semi
  - name: windows with a bad limit
    path: /domotics/uptime/windows?limit=ten
    tier: semi
  - name: wrong method
    method: POST
    path: /domotics/uptime
    tier: semi
