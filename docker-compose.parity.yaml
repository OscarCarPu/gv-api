# Parity stack (design D15): the last Go release and the Python app side by side, each on its
# own clone of the same snapshot. A separate project, so it never touches the dev stack.
# Driven by tests/parity/stack.sh (`make parity-up`, `make parity`).
name: gv-parity

x-app: &app
  env_file: tests/parity/parity.env
  user: "1000:1000"
  depends_on:
    db:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
    interval: 1s
    timeout: 2s
    retries: 30

services:
  db:
    image: postgres:15-alpine
    env_file: tests/parity/parity.env
    ports:
      - "127.0.0.1:15432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parity -d postgres"]
      interval: 1s
      timeout: 2s
      retries: 30

  go:
    <<: *app
    # Built by stack.sh from `git archive go-final`.
    image: gv-api-go:go-final
    environment:
      DATABASE_URL: postgresql://parity:parity@db:5432/parity_go?sslmode=disable
    ports:
      - "127.0.0.1:18180:8080"

  py:
    <<: *app
    image: gv-api-py:parity
    build:
      context: .
      dockerfile: Dockerfile.py
    environment:
      DATABASE_URL: postgresql://parity:parity@db:5432/parity_py?sslmode=disable
    ports:
      - "127.0.0.1:18181:8080"
