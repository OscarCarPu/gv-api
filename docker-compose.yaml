services:
  db:
    image: postgres:15-alpine
    container_name: gv_db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - gv
    restart: unless-stopped

  gv-api:
    build: .
    container_name: gv_api
    # Uid 1000 (ocp) exists on the deploy host, so the reference dbus-daemon can resolve the
    # connecting uid and won't reset the D-Bus connection. See the volumes comment below.
    user: "1000:1000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8080:8080"
    # The uptime domain reads central-pipeline's database, which is a separate compose stack:
    # reachable only through the port it publishes on the host, not on the `gv` network.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Domotics lights talk to the bulbs over BlueZ, which lives on the host and is reached
      # through its D-Bus socket. No host networking and no extra capabilities are needed —
      # BlueZ's own policy lets any local uid send to org.bluez. Without the mount the API
      # still runs; every bulb simply reads offline.
      #
      # One catch, measured rather than guessed: the reference dbus-daemon resolves the
      # connecting uid to a host user, and drops the connection ("connection reset by peer")
      # when it cannot. The image normally runs as uid 100, which usually exists nowhere on
      # the host, so the `user:` override above pins it to a uid the host actually knows.
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - gv
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  gv:
    external: true
