services:
  db:
    image: postgres:15-alpine
    container_name: gv_db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - gv
    restart: unless-stopped

  gv-api:
    build: .
    container_name: gv_api
    # dbus-daemon drops connections from uids unknown on the host; 1000 exists there.
    user: "1000:1000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8080:8080"
    # central-pipeline's database is only reachable through its published host port.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Host BlueZ for the lights; without it every bulb reads offline.
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
      - ./backups:/backups
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - gv
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  gv:
    external: true
