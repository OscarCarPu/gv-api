version: "2"
sql:
  # One package for the whole schema: every domain's queries land in their own
  # <domain>.sql.go, but the models and the pool wiring are shared instead of
  # being regenerated identically once per domain.
  - schema: "db/migrations"
    queries: "db/queries"
    engine: "postgresql"
    gen:
      go:
        package: "gvdb"
        sql_package: "pgx/v5"
        out: "internal/database/gvdb"
        emit_json_tags: true
        emit_db_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true

        overrides:
          - db_type: "date"
            go_type: "time.Time"
          - db_type: "pg_catalog.numeric"
            go_type:
              import: "github.com/shopspring/decimal"
              type: "Decimal"
            nullable: false
          - db_type: "pg_catalog.numeric"
            go_type:
              import: "github.com/shopspring/decimal"
              type: "Decimal"
              pointer: true
            nullable: true
          - db_type: "transaction_type"
            go_type:
              import: "gv-api/internal/finance/txtype"
              package: "txtype"
              type: "Type"
