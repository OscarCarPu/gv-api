# Alembic for gv-api. The database comes from DATABASE_URL (see migrations/env.py);
# the app runs migrations itself at startup (gv_api.db.migrate).
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = src
path_separator = os

[loggers]
keys = root

[handlers]
keys =

[formatters]
keys =

[logger_root]
level = WARNING
handlers =
