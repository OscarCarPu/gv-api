name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Test
        run: |
          git config --global --add safe.directory /home/ocp/docker/gv/gv-api
          cd /home/ocp/docker/gv/gv-api
          git pull
          make lint
          go test -short ./internal/...

      - name: Backup database
        run: |
          cd /home/ocp/docker/gv/gv-api
          # Best-effort: db-backup won't exist yet on the very first deploy after it's
          # introduced, and a deploy shouldn't fail just because the safety net isn't up.
          docker compose exec -T db-backup /backup.sh || echo "::warning::pre-deploy backup skipped or failed"

      - name: Deploy
        run: |
          cd /home/ocp/docker/gv/gv-api
          # --wait-timeout bounds the restart-backoff loop; without it a
          # crash-looping container just hangs the job instead of failing it.
          if ! docker compose up --build --wait --wait-timeout 90 -d; then
            echo "::error::gv_api did not become healthy - deploy failed"
            docker compose ps
            docker compose logs --tail 50 gv-api
            exit 1
          fi
