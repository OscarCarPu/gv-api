name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Test
        run: |
          git config --global --add safe.directory /home/ocp/docker/gv/gv-api
          cd /home/ocp/docker/gv/gv-api
          git pull
          make lint
          go test -short ./internal/...

      - name: Deploy
        run: |
          cd /home/ocp/docker/gv/gv-api
          # --wait-timeout bounds the restart-backoff loop; without it a
          # crash-looping container just hangs the job instead of failing it.
          if ! docker compose up --build --wait --wait-timeout 90 -d; then
            echo "::error::gv_api did not become healthy - deploy failed"
            docker compose ps
            docker compose logs --tail 50 gv-api
            exit 1
          fi
