name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Test
        run: |
          git config --global --add safe.directory /home/ocp/docker/gv/gv-api
          cd /home/ocp/docker/gv/gv-api
          git fetch origin
          git reset --hard origin/main
          make lint
          go test -short ./internal/...

      - name: Backup database
        run: |
          cd /home/ocp/docker/gv/gv-api
          docker run --rm -v "$PWD/backups:/b" alpine:3.22 sh -c "mkdir -p /b/hourly /b/daily && chown 1000:1000 /b /b/hourly /b/daily"
          # Best-effort: a failed backup must not block the deploy.
          docker compose exec -T gv-api ./main backup || echo "::warning::pre-deploy backup skipped or failed"

      - name: Deploy
        run: |
          cd /home/ocp/docker/gv/gv-api
          # --wait-timeout makes a crash-looping container fail the job instead of hanging it.
          if ! docker compose up --build --wait --wait-timeout 90 --remove-orphans -d; then
            echo "::error::gv_api did not become healthy - deploy failed"
            docker compose ps
            docker compose logs --tail 50 gv-api
            exit 1
          fi

      - name: Push to ECR
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: eu-south-2
          REGISTRY: 715831355178.dkr.ecr.eu-south-2.amazonaws.com
        run: |
          aws() { docker run --rm -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_REGION amazon/aws-cli "$@"; }
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          docker tag gv-api:latest "$REGISTRY/gv-api:latest"
          docker push "$REGISTRY/gv-api:latest"
          # Keep latest and the manifests its index references; delete everything else.
          keep=$(aws ecr batch-get-image --repository-name gv-api --image-ids imageTag=latest --query 'images[0].[imageId.imageDigest,imageManifest]' --output text | grep -o 'sha256:[0-9a-f]\{64\}' | sort -u)
          [ -n "$keep" ]
          old=$(aws ecr list-images --repository-name gv-api --query 'imageIds[].imageDigest' --output text | tr '\t' '\n' | grep -vxFf <(echo "$keep") || true)
          if [ -n "$old" ]; then
            aws ecr batch-delete-image --repository-name gv-api --image-ids $(printf 'imageDigest=%s ' $old)
          fi
