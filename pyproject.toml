[project]
name = "gv-api"
version = "0.1.0"
description = "Single-user API that centralises personal data from services and devices."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.16",
    "asyncpg>=0.30",
    "boto3>=1.40",
    "fastapi>=0.120",
    "httpx>=0.28",
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
    "pyjwt>=2.10",
    "pyotp>=2.9",
    "sqlalchemy[asyncio]>=2.0.44",
    "uvicorn[standard]>=0.38",
]

[project.scripts]
gv-api = "gv_api.cli:main"

[dependency-groups]
dev = [
    "boto3-stubs[s3,ssm]>=1.40",
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "pytest-cov>=7.0",
    "ruff>=0.14",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]
# Operator scripts that predate the rewrite.
extend-exclude = ["scripts/auth.py", "scripts/fake_prusalink.py", "Dockerfile.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.14"
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["gv_api"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"
markers = [
    "integration: needs the test database (TEST_DB_URL)",
    "e2e: needs the running API",
]

[tool.coverage.run]
source = ["gv_api"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.pyright]
venvPath = "."
venv = ".venv"
